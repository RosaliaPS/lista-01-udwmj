<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 01 - UDWMJ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #resultado {
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Contador de Cliques</h2>
        <p>Clique no botão abaixo para interagir:</p>
        <button id="btnContar">Clique Aqui</button>
        <p id="resultado">Botão clicado 0 vezes.</p>
    </div>

    <script>
        let contador = 0;
        const botao = document.getElementById('btnContar');
        const elementoResultado = document.getElementById('resultado');

        botao.addEventListener('click', () => {
            contador++;
            elementoResultado.textContent = `Botão clicado ${contador} vezes.`;
        });
    </script>

</body>
</html>
